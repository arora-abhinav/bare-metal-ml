[build-system]
requires = ["setuptools", "pybind11>=2.10"]
build-backend = "setuptools.build_meta"

[project]
name = "bare-metal-ml"
version = "0.1.0"
description = "Classical ML algorithms and a neural network with custom autograd, implemented from scratch in C++ with a Python API. No NumPy or ML library dependencies."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
keywords = ["machine learning", "neural network", "autograd", "C++", "from scratch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/arora-abhinav/bare-metal-ml"
Repository = "https://github.com/arora-abhinav/bare-metal-ml"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
